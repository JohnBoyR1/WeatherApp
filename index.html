<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample HTML Page</title>

    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1D1JkUjz1gqkRr5jzFZC+1zF5n5zF5n5zF5n5zF5n5zF" crossorigin="anonymous">
</head>

<body>
    <div class="row container-fluid mx-auto">


        <div class="col-12 col-lg-5 right-card"><!--right column-->
            <div class="row input ">
                <input id="input-label" type="text" name="location" placeholder="Another location" class="mb-5">
                <button id="search-btn" class="btn btn-primary mb-5">&#x1F50D;</button>
            </div>
            <div class="suggestions-Div">
                <p id="sug" class="light-text suggestion">Sydney</p>
                <p id="sug"class="light-text suggestion">Manchester</p>
                <p id="sug" class="light-text suggestion">New York</p>
                <p id="sug" class="light-text suggestion">California</p>
                <p id="sug" class="light-text suggestion">Hong Kong</p>
                <p id="sug"class="light-text suggestion">Beijing</p>
                <p id="sug"class="light-text suggestion">Cape Town</p>

                <div class="line my-5"></div>
                <div class="row px-3 mt-3 mb-3">
                    <h1 id="temp" class="large-font mr-3">26&nbsp;&deg;C</h1>
                    <div class="d-flex flex-column mr-3">
                        <h2 id="place" class="mt-3 mb-0">London</h2>
                        <medium id="date">10:36 - Tuesday, 22 Oct '19</medium>
                        <medium id="date2"></medium>
                    </div>
                    <div class="d-flex flex-column text-center">
                        <h3 class="fa fa-sun-o mt-4"></h3>
                        <medium id="description"></medium>
                    </div>
                </div>


                <div class="line mt-3"></div>
            </div>
        </div>

        <div class="col-12 col-lg-7 left-card"><!--left column-->

            <div id="video" class="text-center ratio ratio-16x9 rounded-4 overflo-hidden">
                <video  autoplay muted loop playsinline>
                    <source  src="images/big_clouds.mp4" type="video/mp4"/>
                </video>
            </div>
           
        </div>
        <div id="weather-data"></div>



    </div>


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1D1JkUjz1gqkRr5jzFZC+1zF5n5zF5n5zF5n5zF5n5zF" crossorigin="anonymous">

    <!-- Font Awesome (for weather icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+YFQZ5n5zF5n5zF5n5zF5n5zF5n5zF"
        crossorigin="anonymous"></script>
    <!-- JavaScript file -->
    <script src="script.js"></script>
    
</body>

</html>
