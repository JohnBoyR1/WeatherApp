<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>WeatherApp</title>

    <link rel="stylesheet" href="styles/weatherApp.css" >
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" >
  </head>

  <body>
    <div class="container-fluid">
      <div class=" row">
          <!--left fixed column holding search inputs and displays -->
        <div class="col-12 d-flex flex-wrap" id="card">
              
          <div class="row suggestions-Div" style="max-width: 100%;">
            <div class="d-flex flex-column  mt-1 mb-1" >
              <div id="input_place_div" class="row d-flex ">
                <!--input city/town-->
                <input 
                  id="input_place"
                  type="text"
                  name="location"
                  placeholder="City/Town"
                  class="form-control mt-3 input_lab" 
                >
              </div>
              <!--To verify if the city/town search is in the country.. not essential but choice if outcome is not as explected-->
              <div id="input_country_div" class="row d-flex position-relative" >
                <select id="countryDropMenu" class="form-select mt-3 d-flex" size="x" >
                  <option value="">Country to verify</option>
                </select>
                <!--&#x1F50D;=== magnifying glass-->
                <button id="search-btn" type="button" class="btn btn-info position-absolute bottom-0 end-0">
                  &#x1F50D;
                </button>
              </div>
            </div>
            <!--suggestions places on UI when clicked will search-->
            <p class="light-text suggestion">London</p>
            <p class="light-text suggestion">Istanbul</p>
            <p class="light-text suggestion">New York</p>
            <p class="light-text suggestion">Hong Kong</p>
            <p class="light-text suggestion">Cape Town</p>
            <p class="light-text suggestion">Sydney</p>
            <!--decorative lines-->
            <div class="line my-2"></div>

            <div class="row px-3 mt-2 mb-2 ">
              <!--Temperate of selected country default is set at 26 degree C (dummie data) unless searched-->
              <h1 id="temp" >26&nbsp;&deg;C</h1>
              <div class="d-flex flex-column mr-3">
                <!--City/Town search London by default (dummie data) unless searched-->
                <h2 id="place" class="mt-2 mb-0">London</h2>
                <br> 
                <p class="info" id="date"></p><!--time: hour, minute, second-->
                <p class="info" id="date2"></p><!--day-->
                <p class="info" id="date3"></p><!--date: day-month-year-->
                <!--using fa fa-sun-o mt-4 sun icon -->
                <p class="info fa fa-sun-o mt-2"  id="description"></p><!--description of the weather--> 
                <p class="info" id="location_time"></p><!--city/town searched estimeated time of the location: -->
              </div>
            </div>
            <!--decorative lines-->
            <div class="line mt-2"></div>
            
          </div>
        </div>  
      </div>
      <!--background video-->
      <video id="video" class="lazyload" autoplay muted loop playsinline preload="none" >
        <source src="images/cloudy_2k.mp4" type="video/mp4" >
      </video>
    </div>

    
   

    <!-- Font fa fa-cloud, fa fa-sun-o, fa fa-umbrella (for weather icons) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    >

    
    <!-- JavaScript file -->
    <script src="script/weatherApp.js"></script>
  </body>
</html>
